# /etc/strongswan.conf del concentrador emulado.
# Mantiene los includes por defecto de Debian (carga de plugins charon) y
# agrega logging a stderr para que quede visible en `docker compose logs`.

charon {
    load_modular = yes
    plugins {
        include strongswan.d/charon/*.conf
    }
    filelog {
        stderr {
            default = 1
            ike     = 2
            knl     = 2
            cfg     = 2
            net     = 2
        }
    }
}

include strongswan.d/*.conf
