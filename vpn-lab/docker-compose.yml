services:
  concentrator:
    build: ./concentrator
    container_name: vpn-concentrator
    init: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
      net.ipv4.conf.all.accept_redirects: 0
      net.ipv4.conf.all.send_redirects: 0
    env_file:
      - .env
    networks:
      wan: {}
      internal_lan:
        ipv4_address: ${CONCENTRATOR_INTERNAL_IP}
    ports:
      # NAT-T: todo (IKE y ESP encapsulado) viaja por estos dos puertos UDP,
      # no hace falta reenviar el protocolo IP 50 (ESP) ni usar macvlan.
      - "500:500/udp"
      - "4500:4500/udp"
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: vpn-branch-web
    networks:
      internal_lan:
        ipv4_address: ${WEB_CONTAINER_IP}
    volumes:
      - ./web/html:/usr/share/nginx/html:ro
    restart: unless-stopped
    # Sin red "wan": solo alcanzable a través del concentrador (y por lo
    # tanto, solo a través del túnel IPSEC desde la Raspberry Pi).

networks:
  # Red con salida normal (NAT de Docker) — es la que expone los puertos
  # 500/4500 UDP hacia la LAN física del Mac mini.
  wan:
    driver: bridge

  # Red aislada: internal:true evita que Docker le dé salida a Internet o al
  # host. El único miembro con otra pata de red es "concentrator", que
  # enruta (dentro de su propio namespace) el tráfico descifrado del túnel
  # hacia aquí.
  internal_lan:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: ${CONCENTRATOR_SUBNET}
          gateway: 10.255.0.254
