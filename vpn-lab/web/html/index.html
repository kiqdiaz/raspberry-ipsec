<h1>Contenido alcanzado a través del túnel IPSEC</h1>
<p>Si ves esta página, el tráfico llegó desde la Raspberry Pi, cruzó el
túnel IPSEC hacia el concentrador emulado, y fue enrutado a la red interna

ninguna otra ruta de acceso.</p>
